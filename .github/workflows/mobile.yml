name: Android Mobile
on:
  push:
    paths: ['apps/mobile/**', 'shared/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties']
  pull_request:
    paths: ['apps/mobile/**', 'shared/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Gradle 8.11.1
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Build mobile APK
        run: gradle :apps:mobile:app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: experience-tv-mobile-debug
          path: apps/mobile/app/build/outputs/apk/debug/*.apk
